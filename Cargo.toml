[workspace]
resolver = "3"
members = [
    "crates/pazari-proto",
    "crates/pazari-types",
    "crates/pazari-config",
    "crates/pazari-systemd",
    "crates/pazari-metrics",
    "crates/pazari-transport",
    "crates/pazari-agent",
    "crates/pazarid",
    "crates/pazari-stress",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = [
    "Nikolaos Karaolidis <nick@karaolidis.com>",
]

[workspace.dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
bytesize = "2.7.0"
clap = "4.6.7"
doku = "0.21.2"
enum_dispatch = "0.3.13"
http-body-util = "0.1.5"
humantime = "2.4.0"
humantime-serde = "1.1.1"
hyper = "1.11.1"
hyper-util = "0.1.20"
libc = "0.2.189"
pazari-agent = { path = "crates/pazari-agent" }
pazari-config = { path = "crates/pazari-config" }
pazari-metrics = { path = "crates/pazari-metrics" }
pazari-proto = { path = "crates/pazari-proto" }
pazari-systemd = { path = "crates/pazari-systemd" }
pazari-transport = { path = "crates/pazari-transport" }
pazari-types = { path = "crates/pazari-types" }
prometheus-client = "0.25.1"
proptest = "1.11.0"
rustix = "1.1.5"
sd-notify = "0.5.0"
serde = "1.0.229"
serde-inline-default = "1.0.2"
serde_json = "1.0.151"
serde_with = { version = "3.23.0", default-features = false }
signal-hook = { version = "0.4.4", default-features = false }
systemd-journal-logger = "2.2.2"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false }
tokio-vsock = "0.7.2"
toml = "1.1.6"
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = "0.3.23"
zbus = { version = "5.19.0", default-features = false }

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }

missing_docs_in_private_items = "allow"
missing_errors_doc            = "allow"
missing_panics_doc            = "allow"
similar_names                 = "allow"
too_many_lines                = "allow"
too_many_arguments            = "allow"
cognitive_complexity          = "allow"

unwrap_used = "deny"

[profile.release]
panic         = 'abort'
strip         = true
lto           = true
codegen-units = 1

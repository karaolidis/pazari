[package]
name = "pazari-agent"
version = "0.1.0"
edition = "2024"
description = "pazari guest agent"
authors = [
    "Nikolaos Karaolidis <nick@karaolidis.com>",
]

[lints]
workspace = true

[[bin]]
name = "pazari-agent"
path = "src/main.rs"

[dependencies]
pazari-proto = { path = "../pazari-proto" }
pazari-types = { path = "../pazari-types" }
rustix = { version = "1.1.5", features = ["net"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time", "sync", "net", "fs", "io-util"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time", "sync", "net", "fs", "io-util", "macros", "rt-multi-thread"] }

[package]
name = "pazari-agent"
version = "0.1.0"
edition = "2024"
description = "pazari guest agent"
authors = [
    "Nikolaos Karaolidis <nick@karaolidis.com>",
]

[lints]
workspace = true

[[bin]]
name = "pazari-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytesize = { version = "2.7.0", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
doku = "0.21.2"
humantime-serde = "1.1.1"
pazari-proto = { path = "../pazari-proto" }
pazari-systemd = { path = "../pazari-systemd" }
pazari-transport = { path = "../pazari-transport" }
pazari-types = { path = "../pazari-types" }
rustix = { version = "1.1.5", features = ["net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-inline-default = "1.0.2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time", "sync", "net", "fs", "io-util", "macros", "signal"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time", "sync", "net", "fs", "io-util", "macros", "rt-multi-thread"] }

[package]
name = "pazari-agent"
version.workspace = true
edition.workspace = true
description = "pazari guest agent"
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "pazari-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytesize = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
doku.workspace = true
enum_dispatch.workspace = true
humantime-serde.workspace = true
pazari-config.workspace = true
pazari-metrics.workspace = true
pazari-proto.workspace = true
pazari-systemd.workspace = true
pazari-transport.workspace = true
pazari-types.workspace = true
rustix = { workspace = true, features = ["net"] }
serde = { workspace = true, features = ["derive"] }
serde-inline-default.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "net", "fs", "io-util", "macros", "signal"] }
tracing.workspace = true
zbus = { workspace = true, features = ["tokio"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "net", "fs", "io-util", "macros", "rt-multi-thread", "test-util"] }

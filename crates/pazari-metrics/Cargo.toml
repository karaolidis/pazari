[package]
name = "pazari-metrics"
version = "0.1.0"
edition = "2024"
description = "Prometheus metrics for the pazari binaries"
authors = [
    "Nikolaos Karaolidis <nick@karaolidis.com>",
]

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
prometheus-client = "0.25.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt", "test-util", "time"] }

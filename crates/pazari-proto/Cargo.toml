[package]
name = "pazari-proto"
version = "0.1.0"
edition = "2024"
description = "Wire protocol for pazari guest-host negotiation"
authors = [
    "Nikolaos Karaolidis <nick@karaolidis.com>",
]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.23.0"
thiserror = "2.0.20"

[dev-dependencies]
proptest = "1.11.0"

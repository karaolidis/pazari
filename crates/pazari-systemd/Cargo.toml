[package]
name = "pazari-systemd"
version = "0.1.0"
edition = "2024"
description = "Service manager integration for pazari"
authors = [
    "Nikolaos Karaolidis <nick@karaolidis.com>",
]

[lints]
workspace = true

[dependencies]
sd-notify = "0.5.0"
systemd-journal-logger = "2.2.2"
tokio = { version = "1.53.1", default-features = false, features = ["time"] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "time"] }

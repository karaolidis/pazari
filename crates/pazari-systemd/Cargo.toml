[package]
name = "pazari-systemd"
version = "0.1.0"
edition = "2024"
description = "Service manager integration for pazari"
authors = [
    "Nikolaos Karaolidis <nick@karaolidis.com>",
]

[lints]
workspace = true

[dependencies]
sd-notify = "0.5.0"
tokio = { version = "1.53.1", default-features = false, features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "time"] }

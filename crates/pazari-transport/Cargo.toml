[package]
name = "pazari-transport"
version = "0.1.0"
edition = "2024"
description = "Transport abstractions and adapters for pazari"
authors = [
    "Nikolaos Karaolidis <nick@karaolidis.com>",
]

[lints]
workspace = true

[dependencies]
pazari-proto = { path = "../pazari-proto" }
serde = "1.0.229"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["net", "io-util", "rt"] }
tokio-vsock = "0.7.2"

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "rt"] }

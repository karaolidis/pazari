[package]
name = "pazari-transport"
version.workspace = true
edition.workspace = true
description = "Transport abstractions and adapters for pazari"
authors.workspace = true

[lints]
workspace = true

[dependencies]
pazari-proto.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync"] }
tokio-vsock.workspace = true

[dev-dependencies]
pazari-proto = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "rt"] }

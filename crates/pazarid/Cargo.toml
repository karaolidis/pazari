[package]
name = "pazarid"
version.workspace = true
edition.workspace = true
description = "pazari host daemon"
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "pazarid"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytesize = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
doku.workspace = true
enum_dispatch.workspace = true
humantime-serde.workspace = true
pazari-config.workspace = true
pazari-metrics.workspace = true
pazari-proto.workspace = true
pazari-systemd.workspace = true
pazari-transport.workspace = true
pazari-types.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-inline-default.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
pazari-agent.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

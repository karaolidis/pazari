[package]
name = "pazarid"
version = "0.1.0"
edition = "2024"
description = "pazari host daemon"
authors = [
    "Nikolaos Karaolidis <nick@karaolidis.com>",
]

[lints]
workspace = true

[[bin]]
name = "pazarid"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytesize = { version = "2.7.0", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
doku = "0.21.2"
enum_dispatch = "0.3.13"
humantime-serde = "1.1.1"
pazari-config = { path = "../pazari-config" }
pazari-metrics = { path = "../pazari-metrics" }
pazari-proto = { path = "../pazari-proto" }
pazari-systemd = { path = "../pazari-systemd" }
pazari-transport = { path = "../pazari-transport" }
pazari-types = { path = "../pazari-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde-inline-default = "1.0.2"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
toml = "1.1.6"
tracing = "0.1.44"

[dev-dependencies]
pazari-agent = { path = "../pazari-agent" }
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "test-util"] }
